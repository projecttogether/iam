name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "26.13.0"

jobs:
  secrets:
    name: Secrets in the history
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The CLI needs no license key or provider credentials.
      - name: Install the pinned Gitleaks CLI
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
      # Every commit of the history, merge commits too, without showing what matched
      # (.gitleaks.toml lists the repository's invented values).
      - name: Scan the history
        run: '"${{ runner.temp }}/gitleaks" git . --log-opts="--diff-merges=first-parent HEAD" --redact=100 --no-banner'

  checks:
    name: Lint, types, unit tests, build, audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Check public repository contents
        run: node scripts/check-public-repository.mjs
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - name: Migrations match the schema
        run: |
          npm run db:generate
          if [ -n "$(git status --porcelain apps/server/drizzle)" ]; then
            git status --porcelain apps/server/drizzle
            echo "The schema in apps/server/src/db/schema.ts has changes without a migration. Run: npm run db:generate"
            exit 1
          fi
      - run: npm run build
      # What the image installs (Dockerfile, prod-deps).
      - run: npm audit --omit=dev --omit=optional --audit-level=high

  integration:
    name: Integration tests (PostgreSQL 18)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: iam
          POSTGRES_USER: iam
          POSTGRES_PASSWORD: iam
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iam" --health-interval 5s --health-retries 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Integration tests on PostgreSQL
        env:
          TEST_DATABASE_URL: postgres://iam:iam@localhost:5432/iam_test
        run: npm run test:integration

  image:
    name: Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      COMPOSE_FILE: compose.yaml:compose.postgres.yaml
      COMPOSE_PROJECT_NAME: iam-ci-${{ github.run_id }}-${{ github.run_attempt }}
      # The image built here, under the name compose.yaml runs, and fake settings.
      IAM_IMAGE_TAG: ci
      POSTGRES_PASSWORD: ci-only-password
      DATABASE_URL: postgresql://iam:ci-only-password@postgres:5432/iam
      APP_URL: http://localhost:8000
      AUTH_SECRET: ci-only-not-a-secret-ci-only-not-a-secret
      ENCRYPTION_KEY: Y2ktb25seS1ub3QtYS1zZWNyZXQta2V5LTAwMDAwMDA=
      OIDC_ISSUER: https://sso.example.invalid/realms/iam
      OIDC_CLIENT_ID: iam
      OIDC_CLIENT_SECRET: ci-only
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t ghcr.io/projecttogether/iam:ci --build-arg APP_VERSION=ci .
      # The user of every earlier version of the image.
      - name: The image runs as a non-root user (uid 10001)
        run: test "$(docker run --rm --entrypoint id ghcr.io/projecttogether/iam:ci -u)" = "10001"
      - name: The image refuses to start without its settings
        run: |
          docker run --rm ghcr.io/projecttogether/iam:ci migrate 2>&1 | grep -q "Invalid configuration" \
            || { echo "The image started without its settings"; exit 1; }
      - name: The image has the operator command
        run: |
          docker run --rm ghcr.io/projecttogether/iam:ci cli help | grep -q "settings apply"
          docker run --rm --entrypoint cli ghcr.io/projecttogether/iam:ci help | grep -q "settings apply"
          docker run --rm ghcr.io/projecttogether/iam:ci cli generate-key | grep -Eq '^[A-Za-z0-9_-]{43}=$'
      - name: compose.yaml starts the migration, web and worker
        run: |
          docker compose up -d --wait --wait-timeout 180 web worker
          docker compose exec -T web node -e "fetch('http://127.0.0.1:8000/-/readyz').then((r) => process.exit(r.ok ? 0 : 1))"
          curl -fsS -H "accept: text/html" http://localhost:8000/login | grep -q '<div id="root">'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/v1/me)" = "401"
          docker compose exec -T web cli settings list | grep -Eq '^app +'
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Remove CI containers and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans

  end-to-end:
    name: End-to-end with Keycloak (browser)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Start PostgreSQL, Keycloak and Mailpit
        run: docker compose -f compose.dev.yaml up --detach --wait

      - name: Build production image
        run: docker build --tag iam:ci .

      - name: Start web and worker
        run: |
          env_args=(
            -e NODE_ENV=development
            -e DATABASE_URL=postgresql://iam:iam@localhost:55438/iam
            -e APP_URL=http://localhost:8000
            -e KEYCLOAK_URL=http://localhost:8098 -e KEYCLOAK_REALM=iam
            -e OIDC_CLIENT_ID=iam -e OIDC_CLIENT_SECRET=iam-dev-client-secret
            -e OIDC_ADMIN_GROUPS=/iam/admins -e WORKER_POLL_SECONDS=1
          )
          docker run --rm --network host "${env_args[@]}" iam:ci migrate
          docker run -d --name web --network host "${env_args[@]}" iam:ci web
          docker run -d --name worker --network host "${env_args[@]}" iam:ci worker
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/-/healthz && break; sleep 1; done

      - name: Install Playwright and Chromium
        working-directory: tests/browser
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run the end-to-end check
        env:
          OUTPUT_DIR: ${{ runner.temp }}/browser
        run: node tests/browser/e2e.mjs

      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: end-to-end-screenshots
          path: ${{ runner.temp }}/browser/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Show logs on failure
        if: failure()
        run: |
          docker logs web || true
          docker logs worker || true
          docker compose -f compose.dev.yaml logs --no-color keycloak | tail -100
